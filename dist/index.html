<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>Gameking</title>
    <link rel="stylesheet" href="/static/style.css?v=scrolling-scene-1">
</head>

<body>
    <!-- The background container for p5.js to attach the canvas dynamically. -->
    <div id="backgroundCanvas"></div>

    <header>
        <div class="header-left">
            <a href="/">
                <img src="/static/images/gameking_logo_1.png" alt="Gameking Logo" class="header-logo">
            </a>
        </div>
    </header>

    <main>
        <section class="projects-section">
            <h2>
            <img src="/static/images/idea_lab_logo.png" alt="FUNZIES" />
            </h2>
            <div class="project-grid">
                <div class="project-row">
                    <a href="/tictactoe.html">
                        <div class="project-circle" id="project1">
                            <img src="/static/images/cross.jpg" alt="Tic-Tac-Toe" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto;" />
                        </div>
                    </a>
                    <a href="/beforegta6.html">
                        <div class="project-circle" id="project2">
                            <!-- GTA hover bubble text: change this message manually whenever you want. -->
                            <span class="gta-hover-bubble">work in progress</span>
                            <img src="/static/images/beforegta6.jpg" alt="beforegta6"
                                style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto;" />
                        </div>
                    </a>
                    <a href="/dashy" aria-label="Open Dashy internal dashboard">
                        <div class="project-circle" id="project3">
                            <img src="/static/images/dashy-home-icon.svg" alt="Dashy internal dashboard"
                                style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto;" />
                        </div>
                    </a>
                    <div class="project-circle" id="project4"></div>
                </div>
                <div class="project-row">
                    <div class="project-circle" id="project5"></div>
                    <div class="project-circle" id="project6"></div>
                    <div class="project-circle" id="project7"></div>
                </div>
                <div id="tictactoe-modal" class="modal-content" style="display: none;">
                  <div class="modal-header"> MEGA TIC-TAC-TOE
                    <span class="close">&times;</span>
                  </div>
                  <div class="modal-body" id="tictactoe-game">
                    <!-- The game will be loaded here -->
                  </div>
                </div>
                <!-- This div adds extra scrollability, as per your request -->
                <div style="height: 1000px;"></div>
            </div>
        </section>
    </main>


    <footer>
        <div class="contacts-section">
            <h3>Contacts:</h3>
            <p>Email: gameking@email.com</p>
            <p>Phone: 123-456-7890</p>
        </div>
    </footer>

    <script>
        const PIXEL_BG_PATH = "/static/images/pixelbg.png";
        const man_waving = "/static/images/pixil-gif-drawing.gif";
        const Sheep = "/static/images/sheep_1.gif";

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Unable to load ${src}`));
                document.body.appendChild(script);
            });
        }

        function startBackgroundAnimation() {
            loadScript("https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js")
                .then(() =>                                 loadScript("/static/js/background.js?v=sheep-animation-0-5fps-1"))
                .then(() => new p5())
                .catch((error) => console.error("Background animation unavailable:", error));
        }

        if ("requestIdleCallback" in window) {
            requestIdleCallback(startBackgroundAnimation, { timeout: 1500 });
        } else {
            window.setTimeout(startBackgroundAnimation, 0);
        }
    </script>
</body>
</html>
