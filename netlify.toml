# Netlify Configuration for Next.js 15
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/tictactoe"
  to = "/tictactoe.html"
  status = 200

[[redirects]]
  from = "/beforegta6"
  to = "/beforegta6.html"
  status = 200

[[redirects]]
  from = "/dashy"
  to = "/dashy.html"
  status = 200
